apiVersion: v1
kind: Service
metadata:
  name: springboot-service
  namespace: blog-app
spec:
  type: NodePort
  selector:
    app: springboot
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30007

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot
  namespace: blog-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
        - name: springboot
          image: blogging-apps-new:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/bloghub
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: rkv@2712